name: Create new Release

on:
  workflow_dispatch:
    inputs:
      versionIncrement:
        description: 'Which part of the version to increment'
        type: choice
        required: true
        default: minor
        options:
        - patch
        - minor
        - major
      prerelease:
        description: 'Is this a pre-release?'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  id-token: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: 1
  TERM: xterm

jobs:
  release:
    name: Publish new release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: true
        fetch-depth: 0

    - name: Calculate version
      id: version
      run: |
        LATEST=$(git tag --list 'v*' --sort=-v:refname | grep -v -e '-' | head -n 1)
        IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
        MAJOR=${MAJOR:-0}; MINOR=${MINOR:-0}; PATCH=${PATCH:-0}
        case "${{ github.event.inputs.versionIncrement }}" in
          major) VERSION="$((MAJOR + 1)).0.0" ;;
          minor) VERSION="$MAJOR.$((MINOR + 1)).0" ;;
          patch) VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
        esac
        # Prereleases are not tagged, so the run number keeps their versions unique.
        if [ "${{ github.event.inputs.prerelease }}" = "true" ]; then
          VERSION="$VERSION-preview.${{ github.run_number }}"
        fi
        echo "Releasing $VERSION (previous: ${LATEST:-none})"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: Get changelog entries
      id: changelog
      uses: mindsers/changelog-reader-action@v2
      with:
        version: Unreleased
        path: ./CHANGELOG.md

    - name: Setup dotnet
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Test
      run: dotnet test -c Release

    - name: Update CHANGELOG file
      if: github.event.inputs.prerelease == 'false'
      uses: thomaseizinger/keep-a-changelog-new-release@3.1.0
      with:
        version: v${{ steps.version.outputs.version }}

    - name: Ship analyzer releases
      if: github.event.inputs.prerelease == 'false'
      run: |
        UNSHIPPED=src/IfItQuacks.Generator/AnalyzerReleases.Unshipped.md
        SHIPPED=src/IfItQuacks.Generator/AnalyzerReleases.Shipped.md
        BODY=$(grep -v '^;' "$UNSHIPPED" | sed '/./,$!d')
        if [ -n "$BODY" ]; then
          printf '\n## Release %s\n\n%s\n' "${{ steps.version.outputs.version }}" "$BODY" >> "$SHIPPED"
          grep '^;' "$UNSHIPPED" > "$UNSHIPPED.tmp" && mv "$UNSHIPPED.tmp" "$UNSHIPPED"
        fi

    - name: Set git config
      if: github.event.inputs.prerelease == 'false'
      run: |
        git config --local user.email "linkdotnet@action.com"
        git config --local user.name "LinkDotNet Bot"

    - name: Commit changes and push changes
      if: github.event.inputs.prerelease == 'false'
      run: |
        git add CHANGELOG.md src/IfItQuacks.Generator/AnalyzerReleases.*.md
        git commit -m "Update Changelog.md and analyzer releases for ${{ steps.version.outputs.version }} release"
        git push origin main
        echo "RELEASE_COMMIT_HASH=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Create release on GitHub
      if: github.event.inputs.prerelease == 'false'
      uses: thomaseizinger/create-release@2.0.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.version.outputs.version }}
        target_commitish: ${{ env.RELEASE_COMMIT_HASH }}
        name: v${{ steps.version.outputs.version }}
        body: ${{ steps.changelog.outputs.changes }}
        draft: false

    - name: Create release package
      run: |
        dotnet pack -c Release src/IfItQuacks.Generator/IfItQuacks.Generator.csproj -p:PackageVersion=${{ steps.version.outputs.version }} --property:PackageOutputPath=${GITHUB_WORKSPACE}/packages /p:ContinuousIntegrationBuild=true

    - name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
        user: linkdotnet

    - name: Upload to nuget
      run: |
        dotnet nuget push ${GITHUB_WORKSPACE}/packages/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate

  docs:
    needs: release
    if: ${{ !inputs.prerelease }}
    uses: ./.github/workflows/docs.yml
