name: Create new Release

on:
  workflow_dispatch:
    inputs:
      versionIncrement:
        description: 'The new version. For example: 1.1.0 or 1.1.0-preview.1'
        required: true
        default: ''
      prerelease:
        description: 'Is this a pre-release?'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  id-token: write

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: 1
  TERM: xterm

jobs:
  release:
    name: Publish new release
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: true
        fetch-depth: 0

    - name: Get changelog entries
      id: changelog
      uses: mindsers/changelog-reader-action@v2
      with:
        version: Unreleased
        path: ./CHANGELOG.md

    - name: Setup dotnet
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Test
      run: dotnet test -c Release

    - name: Update CHANGELOG file
      if: github.event.inputs.prerelease == 'false'
      uses: thomaseizinger/keep-a-changelog-new-release@3.1.0
      with:
        version: v${{ github.event.inputs.versionIncrement }}

    - name: Ship analyzer releases
      if: github.event.inputs.prerelease == 'false'
      run: |
        UNSHIPPED=src/IfItQuacks.Generator/AnalyzerReleases.Unshipped.md
        SHIPPED=src/IfItQuacks.Generator/AnalyzerReleases.Shipped.md
        BODY=$(grep -v '^;' "$UNSHIPPED" | sed '/./,$!d')
        if [ -n "$BODY" ]; then
          printf '\n## Release %s\n\n%s\n' "${{ github.event.inputs.versionIncrement }}" "$BODY" >> "$SHIPPED"
          grep '^;' "$UNSHIPPED" > "$UNSHIPPED.tmp" && mv "$UNSHIPPED.tmp" "$UNSHIPPED"
        fi

    - name: Set git config
      if: github.event.inputs.prerelease == 'false'
      run: |
        git config --local user.email "linkdotnet@action.com"
        git config --local user.name "LinkDotNet Bot"

    - name: Commit changes and push changes
      if: github.event.inputs.prerelease == 'false'
      run: |
        git add CHANGELOG.md src/IfItQuacks.Generator/AnalyzerReleases.*.md
        git commit -m "Update Changelog.md and analyzer releases for ${{ github.event.inputs.versionIncrement }} release"
        git push origin main
        echo "RELEASE_COMMIT_HASH=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Create release on GitHub
      if: github.event.inputs.prerelease == 'false'
      uses: thomaseizinger/create-release@2.0.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.event.inputs.versionIncrement }}
        target_commitish: ${{ env.RELEASE_COMMIT_HASH }}
        name: v${{ github.event.inputs.versionIncrement }}
        body: ${{ steps.changelog.outputs.changes }}
        draft: false

    - name: Create release package
      run: |
        dotnet pack -c Release src/IfItQuacks.Generator/IfItQuacks.Generator.csproj -p:PackageVersion=${{ github.event.inputs.versionIncrement }} --property:PackageOutputPath=${GITHUB_WORKSPACE}/packages /p:ContinuousIntegrationBuild=true

    - name: NuGet login
      uses: NuGet/login@v1
      id: login
      with:
        user: linkdotnet

    - name: Upload to nuget
      run: |
        dotnet nuget push ${GITHUB_WORKSPACE}/packages/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} -s https://api.nuget.org/v3/index.json --skip-duplicate

  docs:
    needs: release
    if: ${{ !inputs.prerelease }}
    uses: ./.github/workflows/docs.yml
